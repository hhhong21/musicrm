<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicRM - User Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .left {
            flex: 1;
            background: url('https://source.unsplash.com/random/800x600') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #f8f9fa;
            padding: 40px;
        }
        .form-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .form-container h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #eee;
        }
        .verification-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .verification-group input {
            flex: 1;
        }
        .get-code-btn {
            padding: 12px;
            border: none;
            background: #ff5722;
            color: white;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
        }
        .get-code-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: #23233c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #1a1a2e;
        }
        .already {
            margin-top: 15px;
            font-size: 14px;
        }
        .already a {
            color: #23233c;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <h2>Hey, you can take this screen UI, CSS, Swift and Android code for free</h2>
        </div>
        <div class="right">
            <div class="form-container">
                <h1>Register your account</h1>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Please enter your email">
                </div>
                <div class="input-group verification-group">
                    <input type="text" id="verificationCode" placeholder="Enter verification code" disabled>
                    <button class="get-code-btn" id="getCodeBtn">Get Code</button>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Please enter your password">
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password">
                </div>
                <button class="submit-btn" id="submitBtn">Submit</button>
            </div>
            <div class="link-group">
                <a href="/userLogin">Already have an account? Sign In here</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("getCodeBtn").addEventListener("click", function() {
            const email = document.getElementById("email").value;
            if (!email) {
                alert("Please enter your email first.");
                return;
            }

            this.disabled = true;
            this.textContent = "Sending...";

            fetch("http://localhost:8080/api/verification/send", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email })
            })
            .then(response => response.text())
            .then(data => {
                if (data.includes("The verification code has been sent")) {
                    alert("Verification code sent successfully.");
                    document.getElementById("verificationCode").disabled = false;
                    
                    let countdown = 60;
                    const interval = setInterval(() => {
                        countdown--;
                        document.getElementById("getCodeBtn").textContent = `Retry in ${countdown}s`;
                        if (countdown <= 0) {
                            clearInterval(interval);
                            document.getElementById("getCodeBtn").textContent = "Get Code";
                            document.getElementById("getCodeBtn").disabled = false;
                        }
                    }, 1000);
                } else {
                    alert("Failed to send code. Please try again later.");
                    document.getElementById("getCodeBtn").textContent = "Get Code";
                    document.getElementById("getCodeBtn").disabled = false;
                }
            })
            .catch(error => {
                alert("Error sending code.");
                document.getElementById("getCodeBtn").textContent = "Get Code";
                document.getElementById("getCodeBtn").disabled = false;
            });
        });

        document.getElementById("submitBtn").addEventListener("click", function() {
            const email = document.getElementById("email").value;
            const code = document.getElementById("verificationCode").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!email || !code || !password || !confirmPassword) {
                alert("Please fill in all fields.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            fetch("http://localhost:8080/api/userRegister", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password, verificationCode: code })
            })
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    alert("Registration successful! Redirecting to login...");
                    window.location.href = "/userLogin";
                } else {
                    alert(data.error || "Registration failed.");
                }
            })
            .catch(error => {
                alert("Error during registration.");
            });
        });
    </script>
</body>
</html>
