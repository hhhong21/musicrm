<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Resource Management-User Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <h1 class="mb-4">Music Resource Management-User Page</h1>
<!-- Upload music files -->
<div class="card mb-4">
    <div class="card-header">Upload music files</div>
    <div class="card-body">
        <form id="upload-music-form">
            <div class="form-group">
                <label for="music-title">Song title</title></title></label>
                <input type="text" class="form-control" id="music-title" required>
            </div>
            <div class="form-group">
                <label for="music-artist">Singer</label>
                <input type="text" class="form-control" id="music-artist" required>
            </div>
            <div class="form-group">
                <label for="music-album">Album</label>
                <input type="text" class="form-control" id="music-album" required>
            </div>
            <div class="form-group">
                <label for="music-category-ids">Category ID(Multiple items separated by commas)</label>
                <input type="text" class="form-control" id="music-category-ids" required>
            </div>
            <div class="form-group">
                <label for="music-tag-ids">Tag ID(Multiple items separated by commas)</label>
                <input type="text" class="form-control" id="music-tag-ids" required>
            </div>
            <button type="submit" class="btn btn-primary">Upload</button>
        </form>
    </div>
</div>
</body>

</html>
