<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        header {
            background-image: url('4.jpg');
            padding: 15px;
            height: 150px;
        }
        .header h1{
            font-size: 30px;
            font-weight: 680;
            color: #383737;
        }
        .back-to-home {
            text-align: center;
        }
        .back-to-home a {
            font-size: 18px;
            font-weight: 550;
            color: #383737;
            text-decoration: underline;
            text-decoration-color: #383737;
            text-decoration-thickness: 1.5px;
            transition: color 0.3s ease;
        }
        .back-to-home a:hover {
            color: grey;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            color: #383737;
        }
    </style>
</head>
<body>
    <header>
        <h1>Account Management</h1>
        <div class="back-to-home">
            <a href="AdministratorHome.html">Back to Home</a>
        </div>
    </header>
    <div class="container">
        <h2>User Account</h2>
        <div class="lock-unlock">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${userId}"></td>
                        <td th:text="${userName}"></td>
                        <td th:text="${userEmail}"></td>
                        <td><button>Lock</button></td>
                        <td><button>Unlock</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
